<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kalkulator żywienia</title>
  <link rel="manifest" href="manifest.webmanifest" />
</head>
<body>
  <h1>Kalkulator żywienia</h1>

<script>
const PUBLIC_VAPID_KEY = "KezGVTYNjwE7pPBtRe-Vyc1aQJtmqPjTdYhea55BJ_pnjrlibD3zqKHxJiv4pRvm2m11xWMm1DVku6H6SSlLqHI";

async function subscribeUser() {
  const reg = await navigator.serviceWorker.ready;
  const sub = await reg.pushManager.subscribe({
    userVisibleOnly: true,
    applicationServerKey: PUBLIC_VAPID_KEY
  });

  await fetch("https://TWOJ-SERWER.onrender.com/push/subscribe", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(sub)
  });
}

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js");
}
</script>
</body>
</html>
