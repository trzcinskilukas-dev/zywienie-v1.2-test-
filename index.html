<body>
<h1>Kalkulator żywienia</h1>
<script>
const PUBLIC_VAPID_KEY = "BET0-VZnzqKEkjWK5rLssR90w-_uKCXKlqtLSbdkRxfO4KbWcYorokrm9Es-F89bCSdlecKiWpD-5W9VWxikd30";
async function subscribeUser(){
 const reg = await navigator.serviceWorker.ready;
 const sub = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey: PUBLIC_VAPID_KEY });
 await fetch("https://TWOJ-SERWER/push/subscribe",{ method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(sub) });
}
async function syncDrugsToServer(){
 const leki = JSON.parse(localStorage.getItem("leki")||"[]");
 await fetch("https://TWOJ-SERWER/drugs/update",{ method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(leki) });
}
if("serviceWorker" in navigator){ navigator.serviceWorker.register("service-worker.js"); }
</script>
